name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest     # Apple silicon runner: arm64 .dmg/.zip
            dist: dist:mac
            smoke: '"dist/mac-arm64/Paseboon JS.app/Contents/MacOS/Paseboon JS"'
          - os: windows-latest
            dist: dist:win
            smoke: '"dist/win-unpacked/Paseboon JS.exe"'
          - os: ubuntu-latest
            dist: dist:linux
            # Ubuntu 24.04 runners block unprivileged user namespaces, so the
            # Chromium sandbox cannot start under CI; the app enables it everywhere else.
            smoke: xvfb-run -a dist/linux-unpacked/paseboon-js --no-sandbox
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - run: npm run models
      - run: npm test
      - run: npm run ${{ matrix.dist }} -- --publish never
      - name: Smoke-test the packaged app (loads models + native modules, checks network is blocked; no camera, no lock)
        shell: bash
        env:
          PASEBOON_SMOKE: "1"
          PASEBOON_JS_HOME: ${{ runner.temp }}/paseboon-js-smoke
        run: ${{ matrix.smoke }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paseboon-js-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # On a version tag (v*), after all three OS builds pass, publish one GitHub
  # Release with every installer attached, plus SHA256SUMS.txt.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload its assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          pattern: paseboon-js-*
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          ls -la
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="[$ver]" 'index($0, "## ") == 1 { p = index($0, v) > 0; next } p' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Downloads
          - **macOS (Apple silicon):** `.dmg` (or `.zip`). Not notarized: right-click → Open the first time.
          - **Windows (x64):** `Setup .exe`.
          - **Linux (x64):** `.AppImage` or `.deb`.
          - Verify with `SHA256SUMS.txt`.

          On Windows and Linux, CI only verifies that the app installs, starts and blocks
          network. The camera, lock and USB guard have only been tried on macOS.
          EOF
          cat notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" assets/*
          --repo "$GITHUB_REPOSITORY"
          --title "Paseboon JS $GITHUB_REF_NAME"
          --notes-file notes.md
          --verify-tag
